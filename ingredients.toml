# Controlled vocabulary for every ingredient a recipe may use.
#
# Each table key is the ingredient id used in cocktails/*.toml.
#   name      display name (lowercase unless a proper noun)
#   category  spirit | liqueur | fortified-wine | wine | bitters | citrus |
#             juice | sweetener | dairy-egg | mixer | other
#   spirit    base-spirit group, only on spirits that can be a base:
#             gin | whiskey | rum | agave | brandy | vodka
#   citrus    lemon | lime | grapefruit | orange, on anything that brings that
#             citrus to the drink (juices, but also grapefruit soda, Don's Mix)
#
# Keep ids lowercase-kebab. Group by category, alphabetical inside a group.


name: Check and deploy Aperitif

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: ./.github/workflows/site-ci.yml
    with:
      output: _site
      node-version-file: .nvmrc
      python-version-file: .python-version
      npm-ci: true
      check: npm run check
      build: npm run prepare:site
      browser-tests: npm run test:browser

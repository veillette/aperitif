name: Check and publish a static site

on:
  workflow_call:
    inputs:
      output:
        required: true
        type: string
      check:
        required: true
        type: string
      build:
        type: string
      browser-tests:
        type: string
      node-version:
        type: string
      node-version-file:
        type: string
      python-version-file:
        type: string
      npm-ci:
        type: boolean
        default: false
      fetch-depth:
        type: number
        default: 1
      runner:
        type: string
        default: ubuntu-latest

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.npm-ci && 'npm' || '' }}
          package-manager-cache: false
      - if: inputs.python-version-file != ''
        uses: actions/setup-python@v7
        with:
          python-version-file: ${{ inputs.python-version-file }}
      - if: inputs.npm-ci
        run: npm ci
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Check source
        run: ${{ inputs.check }}
      - name: Build the site
        if: inputs.build != ''
        run: ${{ inputs.build }}
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Prepare Chromium
        shell: bash
        run: |
          if [ -f node_modules/playwright/index.mjs ]; then
            playwright="$PWD/node_modules/playwright"
          else
            npm install --prefix "$RUNNER_TEMP/site-smoke" --no-package-lock --no-audit --no-fund playwright@1.65.0
            playwright="$RUNNER_TEMP/site-smoke/node_modules/playwright"
          fi
          node "$playwright/cli.js" install --with-deps --only-shell chromium
          printf 'PLAYWRIGHT_MODULE=%s\n' "$playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Test the deployment artifact
        env:
          SITE_OUTPUT: ${{ inputs.output }}
        run: node .github/site-smoke.mjs "$SITE_OUTPUT"
      - name: Run site-specific browser tests
        if: inputs.browser-tests != ''
        run: ${{ inputs.browser-tests }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.output }}

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
